<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>King's League MENA 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>

<!-- ============ شاشة التحميل ============ -->
<div id="boot" class="screen show"><div class="boot-in"><div class="spin"></div><p id="bootMsg">جاري تحميل المحرك…</p></div></div>

<!-- ============ الشاشة الترحيبية + الفيديو ============ -->
<div id="scrIntro" class="screen">
  <div id="introLogos" class="intro-in">
    <div class="intro-row">
      <figure><img id="inLg1" alt="Kings League MENA"><figcaption>KINGS LEAGUE MENA</figcaption></figure>
      <figure><img id="inLg2" alt="Kings League World Cup"><figcaption>KINGS LEAGUE WORLD CUP</figcaption></figure>
    </div>
    <h1>KING'S LEAGUE <span>3D</span></h1>
    <button class="btn big gold" id="inStart">▶ اضغط للبدء</button>
    <div class="intro-dev"><img id="inDev" alt="DESHA.245"><span>تطوير · DESHA.245</span></div>
  </div>
  <div id="introVid" class="hide"><video id="inVideo" playsinline preload="metadata"></video><button class="btn sm" id="inSkip">تخطي ⏭</button></div>
</div>

<!-- ============ الشاشة الرئيسية ============ -->
<div id="scrHome" class="screen">
  <div class="home2">
    <header class="hm-top"><img class="hm-logo" id="homeLogo" alt=""><h1>KING'S LEAGUE <span>3D</span></h1>
      <div class="hm-tools"><button class="ib" id="btnSettings" title="الإعدادات">⚙️</button><button class="ib" id="btnHow" title="طريقة اللعب">📖</button><button class="ib" id="btnFull" title="ملء الشاشة">⛶</button></div></header>
    <nav class="hm-tabs" id="hmTabs"><button class="on" data-p="0">NORMAL TOURNAMENTS</button><button data-p="1">ONLINE MODS</button><button data-p="2">OTHER MODS</button></nav>
    <div class="hm-pages">
      <section class="hm-page on" data-p="0">
        <button class="hb" data-act="mena" data-img="klm_button,klm_botton"><span class="hb-fb">KINGS LEAGUE MENA</span></button>
        <button class="hb" data-act="nations" data-img="kln_button,kln_botton"><span class="hb-fb">KINGS LEAGUE NATIONS</span></button>
      </section>
      <section class="hm-page" data-p="1">
        <button class="hb" data-act="olm" data-img="ol_button,ol_botton"><span class="hb-fb">ONLINE MATCH</span></button>
        <button class="hb" data-act="ont" data-img="ont_button,ont_botton"><span class="hb-fb">ONLINE TOURNAMENT</span></button>
      </section>
      <section class="hm-page" data-p="2">
        <button class="hb" data-act="career" data-img="cm_button,cm_botton"><span class="hb-fb">CAREER MODE</span></button>
        <button class="hb" data-act="div" data-img="dm_button,dm_botton"><span class="hb-fb">DIVISIONS MODE</span></button>
      </section>
    </div>
    <div class="hm-foot"><button class="btn" data-go="friendly">⚽ مباراة سريعة</button></div>
  </div>
</div>

<!-- ============ اختيار الفريق ============ -->
<div id="scrTeams" class="screen">
  <div class="topbar"><button class="btn sm" data-back="home">→ رجوع</button><h2 id="teamsTitle">اختر فريقك</h2><span></span></div>
  <div id="teamGrid" class="grid"></div>
</div>

<!-- ============ شاشة التشكيلة ============ -->
<div id="scrLineup" class="screen">
  <div class="topbar"><button class="btn sm" id="luBack">→ رجوع</button><h2>التشكيلة · <span id="luTitle"></span></h2><button class="btn sm purple" id="luAuto">⚡ تلقائي</button></div>
  <div class="lu-wrap">
    <div class="lu-main">
      <div id="luPitch" class="lu-pitch"></div>
    </div>
    <div class="lu-side"><p id="luHint" class="small"></p>
      <div class="lu-set">
        <label>التشكيلة<select id="luForm"></select></label>
        <label>الأسلوب<select id="luStyle"><option value="bal">متوازن</option><option value="att">هجومي</option><option value="def">دفاعي</option></select></label>
        <label>الضغط<select id="luPress"><option value="low">منخفض</option><option value="mid">متوسط</option><option value="high">عالٍ</option></select></label>
        <label>الكاميرا<select id="luCam"><option value="0">بث تلفزيوني</option><option value="1">قريبة</option><option value="2">داخل المباراة</option><option value="3">ديناميكية</option><option value="4">من الأعلى</option><option value="5">عرضية</option></select></label>
        <label class="chk"><input type="checkbox" id="luNames"> الأسماء</label>
        <button class="btn big gold" id="luGo">▶ ابدأ المباراة</button>
      </div>
      <div id="luList" class="lu-list"></div>
    </div>
  </div>
</div>

<!-- ============ مركز البطولة ============ -->
<div id="scrHub" class="screen">
  <div class="topbar"><button class="btn sm" id="hubBack">→ القائمة</button><h2 id="hubTitle"></h2><span id="hubUser" class="chip"></span></div>
  <div class="hub-actions" id="hubActions"></div>
  <div class="tabs" id="hubTabs"><button data-tab="table" class="on">الترتيب</button><button data-tab="round">مباريات الجولة</button><button data-tab="results">النتائج</button></div>
  <div id="hubBody" class="hub-body"></div>
</div>

<!-- ============ واجهة المباراة ============ -->
<div id="hud" class="hide">
  <div id="score" dir="ltr">
    <div class="tm" id="sA"><i id="sAl"></i><b id="sAn"></b></div>
    <div class="mid"><div class="sc"><span id="sAs">0</span><em>-</em><span id="sBs">0</span></div><div class="clk"><span id="clk">00:00</span><span id="half">الشوط 1</span></div></div>
    <div class="tm r" id="sB"><b id="sBn"></b><i id="sBl"></i></div>
  </div>
  <div id="tags"></div>
  <div id="topBtns"><button id="bPause" class="ib">⏸</button><button id="bCam" class="ib">🎥</button><button id="bSnd" class="ib">🔊</button></div>
  <button id="cardBtn" class="locked"><span id="cardIco">🃏</span><small id="cardName">—</small></button>
  <div id="psoBox" class="hide"></div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="pad">
    <button id="btnD" class="act d"><span>جري</span></button>
    <button id="btnC" class="act c"><span>مهارة</span></button>
    <button id="btnB" class="act b"><span>تمرير</span></button>
    <button id="btnA" class="act a"><span>تسديد</span></button>
  </div>
</div>

<!-- ============ نوافذ منبثقة ============ -->
<div id="vs" class="overlay hide"></div>
<div id="dice" class="overlay hide"><div class="dice-box"><h3>🎲 لحظة النرد</h3><div id="diceCube">?</div><p id="diceTxt"></p></div></div>
<div id="pickCard" class="overlay hide"><div class="modal"><h3 id="pickTitle"></h3><div id="pickList" class="plist"></div><button class="btn" id="pickCancel">إلغاء</button></div></div>
<div id="jokerBox" class="overlay hide"><div class="modal"><h3>🃏 الخصم يفعّل بطاقة!</h3><p id="jokerTxt"></p><p class="small">لديك الجوكر — اختر:</p><div class="plist"><button class="btn gold" id="jkCancel">🚫 إلغاء البطاقة</button><button class="btn purple" id="jkSteal">🧲 سرقتها واستخدامها</button><button class="btn" id="jkAllow">السماح بها</button></div><p class="small" id="jkTimer"></p></div></div>
<div id="pauseBox" class="overlay hide"><div class="modal"><h3>⏸ إيقاف مؤقت</h3><div class="plist"><button class="btn gold" id="pResume">متابعة</button><button class="btn" id="pCam">تغيير الكاميرا</button><button class="btn" id="pSnd">الصوت</button><button class="btn red" id="pQuit">إنهاء والخروج</button></div></div></div>
<div id="resultBox" class="overlay hide"></div>
<div id="settingsBox" class="overlay hide"><div class="modal"><h3>⚙️ الإعدادات</h3>
  <label>مستوى الصعوبة<select id="setDiff"><option value="0.35">سهل</option><option value="0.7">متوسط</option><option value="1">صعب</option></select></label>
  <label>مدة المباراة الفعلية<select id="setSpm"><option value="4.5">سريعة (3 دقائق)</option><option value="7.5">عادية (5 دقائق)</option><option value="11">طويلة (7.5 دقيقة)</option></select></label>
  <label>الصوت<select id="setSnd"><option value="1">مفعّل</option><option value="0">مغلق</option></select></label>
  <label>الكاميرا<select id="setCam"><option value="0">بث تلفزيوني</option><option value="1">قريبة</option><option value="2">داخل المباراة (خلف اللاعب)</option><option value="3">ديناميكية</option><option value="4">من الأعلى</option><option value="5">عرضية</option></select></label>
  <label>أسماء اللاعبين فوقهم<select id="setNames"><option value="1">ظاهرة</option><option value="0">مخفية</option></select></label>
  <button class="btn gold" id="setClose">حفظ</button></div></div>
<div id="howBox" class="overlay hide"><div class="modal wide"><h3>📖 طريقة اللعب</h3><div class="how" id="howTxt"></div><button class="btn gold" id="howClose">فهمت</button></div></div>
<div id="busy" class="overlay hide"><div class="modal"><div class="spin"></div><p id="busyTxt">جاري محاكاة المباريات…</p></div></div>
<div id="err" class="hide" onclick="this.classList.add('hide')"></div>
<div id="rotate" class="hide"><div>📱↻</div><p>أدر هاتفك للوضع الأفقي لتجربة أفضل</p></div>

<script>
(function () {
  function load(urls, ok, bad) { var i = 0; (function n() { if (i >= urls.length) { bad && bad(); return; } var s = document.createElement('script'); s.src = urls[i++]; s.onload = ok; s.onerror = n; document.head.appendChild(s); })(); }
  window.__loadThree = function (ok, bad) { load(['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js', 'https://unpkg.com/three@0.128.0/build/three.min.js', 'three.min.js'], ok, bad); };
})();
</script>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('err');if(!b)return;b.classList.remove('hide');b.textContent='⚠ '+(e.message||'error')+' @ '+(e.filename||'').split('/').pop()+':'+(e.lineno||'')+'  (اضغط للإخفاء)';});
window.addEventListener('unhandledrejection',function(e){var b=document.getElementById('err');if(!b)return;b.classList.remove('hide');b.textContent='⚠ '+(e.reason&&e.reason.message||e.reason);});
</script>
<script src="game_1.js"></script>
<script src="game_2.js"></script>
<script src="game_3.js"></script>
<script src="game_4.js"></script>
<script src="game_5.js"></script>
<script src="game_6.js"></script>
<script>
window.addEventListener('load',function(){if(!window.__KL_END){var b=document.getElementById('err');if(b){b.classList.remove('hide');b.textContent='⚠ ملف game ناقص أو تالف. أعد نسخه/رفعه كاملاً ولا تفتحه في محرر يقطعه.';}var m=document.getElementById('bootMsg');if(m)m.textContent='ملفات اللعبة غير مكتملة';}});
</script>
</body>
</html>
